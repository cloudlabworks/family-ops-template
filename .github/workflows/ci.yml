name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: OpenAPI lint, model checks, privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Test self-hosted Python API
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r server/requirements.txt
          FAMILYOPS_CONTRACT_CAPTURE=/tmp/contract.json .venv/bin/python -m unittest discover -s tests -v
          node scripts/check-runtime-responses.mjs /tmp/contract.json
          PYTHONPATH=. .venv/bin/python tests/http_smoke.py
      - name: Build runtime image
        run: docker build -t family-ops-api:ci .
