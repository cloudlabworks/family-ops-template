      x-allowed-roles: [parent, teen]
      description: Teens opt themselves in to age-fit entries without approval unless the entry has `needsParent`. Children's opt-ins are made by a parent. Nothing is enabled for anyone by default.
      responses:
        "200":
          description: Opted in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOptIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [apps]
      operationId: optOutApp
      summary: Opt out
      x-allowed-roles: [parent, teen, child]
      description: Any member can opt themselves out at any time.
      responses:
        "204": { description: Opted out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /apps/suggestions:
    get:
      tags: [apps]
      operationId: listAppSuggestions
      summary: The suggestion list
      x-allowed-roles: [parent, teen, child]
      description: Parents see all suggestions; others see their own.
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/AppSuggestion" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [apps]
      operationId: suggestApp
      summary: Suggest an app
      x-allowed-roles: [parent, teen, child]
      description: Creates a suggestion and a request of kind `app` routed to parents. On approval a parent adds it to the catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSuggestionInput" }
      responses:
        "201":
          description: Suggested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Device inventory
      x-allowed-roles: [parent, teen, child]
      description: Teens and children see their own devices only.
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [devices]
      operationId: addDevice
      summary: Register a device
      x-allowed-roles: [parent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /devices/{deviceId}/schedule:
    parameters:
      - $ref: "#/components/parameters/deviceId"
    put:
      tags: [devices]
      operationId: setDeviceSchedule
      summary: Network schedule for a device
      x-allowed-roles: [parent]
      description: Applied by the connector to a DNS filter's per-client rules where supported. Platform screen-time settings are manual (see docs/gaming-platforms.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSchedule" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /devices/{deviceId}/lost:
    parameters:
      - $ref: "#/components/parameters/deviceId"
    post:
      tags: [devices]
      operationId: reportLost
      summary: Report a device lost
      x-allowed-roles: [parent, teen]
      description: |
        Teens may report their own devices. Effect: revoke every session and kiosk credential issued to the
        device, unpair any chat identity enrolled from it, and open a parent checklist (vendor lock or erase).
        No secret lives on a device, so nothing on it needs rotating.
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /devices/{deviceId}/enrolment:
    parameters:
      - $ref: "#/components/parameters/deviceId"
    post:
      tags: [devices]
      operationId: enrolKiosk
      summary: Enrol a display as a kiosk for one member
      x-allowed-roles: [parent]
      description: Returns a one-time enrolment code the parent enters on the display; the display trades it for its own credential, limited to the kiosk routes of the member it serves. Network address is never used as authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boundMember]
              properties:
                boundMember: { type: string }
      responses:
        "201":
          description: Enrolment code
          content:
            application/json:
              schema:
                type: object
                required: [enrolmentCode, expiresAt]
                properties:
                  enrolmentCode: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [devices]
      operationId: revokeKiosk
      summary: Revoke a kiosk credential
      x-allowed-roles: [parent]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Audit log
      x-allowed-roles: [parent]
      description: Append-only; no write or delete route exists. Entries about requests hidden from the caller show only that an entry exists.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /connector/commands:
    get:
      tags: [connector]
      operationId: claimCommands
      summary: Claim queued commands (outbound pull)
      x-allowed-roles: [svc-connector]
      security:
        - serviceToken: []
      description: The connector inside the home calls out to claim work. Claimed commands are leased for 60 seconds.
      parameters:
        - { name: max, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Commands
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands: { type: array, items: { $ref: "#/components/schemas/Command" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /connector/commands/{commandId}/result:
    parameters:
      - { name: commandId, in: path, required: true, schema: { type: string } }
    post:
      tags: [connector]
      operationId: reportCommandResult
      summary: Report a command's outcome
      x-allowed-roles: [svc-connector]
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
                detail: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /connector/snapshots/{target}:
    parameters:
      - { name: target, in: path, required: true, schema: { type: string, enum: [house, media, gaming, devices] } }
    put:
      tags: [connector]
      operationId: putSnapshot
      summary: Push a state snapshot
      x-allowed-roles: [svc-connector]
      security:
        - serviceToken: []
      description: State only. The API rejects payloads containing image or video data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asOf, state]
              properties:
                asOf: { type: string, format: date-time }
                state: { type: object }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /connector/status:
    get:
      tags: [connector]
      operationId: getConnectorStatus
      summary: Connector health for parents
      x-allowed-roles: [parent]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [lastSeen, queued]
                properties:
                  lastSeen: { type: [string, "null"], format: date-time }
                  queued: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    identitySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed identity assertion from your identity-aware proxy or OIDC provider. The API verifies signature, audience and expiry, then maps the subject to a member. Authentication only.
    deviceSession:
      type: http
      scheme: bearer
      description: Per-device kiosk credential from enrolKiosk, bound to one member, revocable.
    serviceToken:
      type: http
      scheme: bearer
      description: Service identity (svc-agent or svc-connector). Never sufficient to act as a parent.
    channelSignature:
      type: apiKey
      in: header
      name: X-Channel-Signature
      description: Signature the messaging platform puts on each callback, verified by the API with a key no household service holds. Used only by channelDecision.

  parameters:
    memberId: { name: memberId, in: path, required: true, schema: { type: string } }
    eventId: { name: eventId, in: path, required: true, schema: { type: string } }
    choreId: { name: choreId, in: path, required: true, schema: { type: string } }
    listId: { name: listId, in: path, required: true, schema: { type: string } }
    requestId: { name: requestId, in: path, required: true, schema: { type: string } }
    deviceId: { name: deviceId, in: path, required: true, schema: { type: string } }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No valid identity
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but not allowed for this object
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found (also returned for objects hidden from the caller)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Stale revision, duplicate decision or illegal state transition
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Role:
      type: string
      enum: [parent, teen, child, young-child, visitor, guest]
    Household:
      type: object
      required: [id, name, timezone, members]
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string, examples: [Etc/UTC] }
        settings:
          type: object
          properties:
            quickReplyDecisions: { type: boolean, default: false, description: "Allow platform-signed quick replies (channelDecision). Off by default." }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
    Member:
      type: object
      required: [id, displayName, role, residency, profile]
      properties:
        id: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
        displayName: { type: string, maxLength: 60 }
        role: { $ref: "#/components/schemas/Role" }
        ageBand: { type: string, enum: [adult, "13-17", "8-12", under-8] }
        residency: { type: string, enum: [resident, visiting] }
        visitSchedule:
          type: array
          description: Visit windows for visiting members (dates only, no locations).
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string, format: date }
              to: { type: string, format: date }
        profile:
          type: string
          enum: [disabled, enabled]
          description: Disabled until a parent enables it. Disabled members appear in no view.
        coOwners:
          type: array
          description: "Parents who jointly own this member's profile. Each one can switch it off, fix entries or erase them."
          items: { type: string }
        interests:
          type: array
          description: Optional tags the member (or a parent, for young children) chose, used only to suggest catalog apps.
          items: { type: string, maxLength: 40 }
    MemberPatch:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }
        residency: { type: string, enum: [resident, visiting] }
        profile: { type: string, enum: [disabled, enabled] }
        revision: { type: integer, minimum: 1 }

    EventInput:
      type: object
      required: [title, start, end, who]
      properties:
        title: { type: string, maxLength: 200 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        allDay: { type: boolean, default: false }
        timezone: { type: string }
        who: { type: array, items: { type: string }, minItems: 1 }
        shared: { type: boolean, default: true }
        private: { type: boolean, default: false, description: Never shown on shared displays or to services. }
        hiddenFrom: { type: array, items: { type: string } }
        kind: { type: string, examples: [family, activity, travel, appointment] }
        labels: { type: array, items: { type: string } }
        location: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 4000 }
        onBehalfOf: { type: string, description: Services only; the verified sender. }
        revision: { type: integer, minimum: 1 }
    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          required: [id, revision, createdBy, updatedAt]
          properties:
            id: { type: string }
            revision: { type: integer }
            createdBy: { type: string }
            updatedAt: { type: string, format: date-time }

    ChoreInput:
      type: object
      required: [title, assignees, cadence]
      properties:
        title: { type: string, maxLength: 120 }
        pictureId: { type: string, description: Icon for picture boards. }
        assignees: { type: array, items: { type: string }, minItems: 1 }
        cadence: { type: string, enum: [daily, weekdays, weekly, once] }
        points: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
    Chore:
      allOf:
        - $ref: "#/components/schemas/ChoreInput"
        - type: object
          required: [id, active]
          properties:
            id: { type: string }
            active: { type: boolean }
    ChoreMark:
      type: object
      required: [id, choreId, who, date, doneAt]
      properties:
        id: { type: string }
        choreId: { type: string }
        who: { type: string }
        date: { type: string, format: date }
        doneAt: { type: string, format: date-time }
        checkedBy: { type: [string, "null"] }
        accepted: { type: [boolean, "null"] }
    AllowanceEntry:
      type: object
      required: [kind, amount, at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [earned, paid, adjustment] }
        amount: { type: number, description: In the household's own unit (points or currency). }
        at: { type: string, format: date-time }
        note: { type: string, maxLength: 280 }

    List:
      type: object
      required: [id, kind, title]
      properties:
        id: { type: string }
        kind: { type: string, enum: [grocery, todo, packing] }
        title: { type: string }
    ListItemInput:
      type: object
      properties:
        text: { type: string, maxLength: 200 }
        pictureId: { type: string }
        onBehalfOf: { type: string }
      oneOf:
        - required: [text]
        - required: [pictureId]
    ListItem:
      type: object
      required: [id, addedBy, addedAt, done, revision]
      properties:
        id: { type: string }
        text: { type: string }
        pictureId: { type: string }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
        done: { type: boolean }
        revision: { type: integer }
    MealDay:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        breakfast: { type: string, maxLength: 120 }
        lunch: { type: string, maxLength: 120 }
        dinner: { type: string, maxLength: 120 }
        recipeUrl: { type: string, format: uri }
        revision: { type: integer, minimum: 1 }

    ActivityInput:
      type: object
      required: [who, title, kind]
      properties:
        who: { type: string }
        title: { type: string, maxLength: 120 }
        kind: { type: string, enum: [school-day, practice, game, lesson, club, form-due, other] }
        recurrence: { type: string, description: RFC 5545 RRULE. }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        due: { type: string, format: date }
        needsPickup: { type: boolean, default: false }
        revision: { type: integer, minimum: 1 }
    Activity:
      allOf:
        - $ref: "#/components/schemas/ActivityInput"
        - type: object
          required: [id, eventId]
          properties:
            id: { type: string }
            eventId: { type: string, description: "The calendar event that is this activity (one record, not a copy)." }
    Pickup:
      type: object
      required: [id, who, at, kind]
      properties:
        id: { type: string }
        who: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [pickup, drop-off] }
        claimedBy: { type: [string, "null"] }

    HouseState:
      type: object
      required: [asOf, rooms]
      properties:
        asOf: { type: string, format: date-time }
        rooms:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              lightsOn: { type: boolean }
              temperatureC: { type: number }
              setpointC: { type: number }
        locks:
          type: array
          items:
            type: object
            required: [id, state]
            properties:
              id: { type: string }
              name: { type: string }
              state: { type: string, enum: [locked, unlocked, jammed, unknown] }
    Scene:
      type: object
      required: [id, name, allowedRoles]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        allowedRoles: { type: array, items: { $ref: "#/components/schemas/Role" } }
    ClimateSetpoint:
      type: object
      required: [setpointC]
      properties:
        setpointC: { type: number, minimum: 10, maximum: 30 }
        hold: { type: string, enum: [until-next-schedule, one-hour, permanent] }
    LockCommand:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [lock, unlock] }
        stepUpToken: { type: string, description: Required for unlock. }
    CameraState:
      type: object
      required: [id, armed]
      properties:
        id: { type: string }
        name: { type: string }
        armed: { type: boolean }
        lastMotionAt: { type: [string, "null"], format: date-time }
    EnergyReport:
      type: object
      required: [range, points]
      properties:
        range: { type: string }
        unit: { type: string, examples: [kWh] }
        points:
          type: array
          items:
            type: object
            required: [at, value]
            properties:
              at: { type: string, format: date-time }
              value: { type: number }
    Command:
      type: object
      required: [id, target, intent, status, createdBy, createdAt]
      properties:
        id: { type: string }
        target: { type: string, enum: [hub, media, display, dns, gaming] }
        intent: { type: object, description: "Typed intent, for example {\"scene\": \"bedtime\"}. Never a raw hub service call." }
        status: { type: string, enum: [queued, leased, done, failed] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        result: { type: [string, "null"] }

    MediaSession:
      type: object
      required: [screen, state]
      properties:
        screen: { type: string }
        state: { type: string, enum: [playing, paused, idle] }
        title: { type: string }
        profile: { type: string }
    CastRequest:
      type: object
      required: [itemId, screen]
      properties:
        itemId: { type: string }
        screen: { type: string }
    Library:
      type: object
      required: [id, name, maxRating]
      properties:
        id: { type: string }
        name: { type: string }
        maxRating: { type: string, examples: [G, PG, PG-13, TV-Y7] }
        schedule: { type: string, description: "Access window enforced by the media server, for example 07:00-20:00." }

    GamingPlatform:
      type: object
      required: [id, enforcement, reads]
      properties:
        id: { type: string, examples: [steam, nintendo-switch, xbox, apple-screen-time, playstation] }
        enforcement: { type: string, enum: [api, manual] }
        reads: { type: string, enum: [usage, presence, none] }
        note: { type: string }
    GamingWindows:
      type: object
      required: [member, windows]
      properties:
        member: { type: string }
        windows:
          type: array
          items:
            type: object
            required: [day, from, to]
            properties:
              day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
              from: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
              to: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        dailyMinutes: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
    GamingToday:
      type: object
      required: [member, window]
      properties:
        member: { type: string }
        window: { type: string }
        minutesUsed: { type: [integer, "null"], description: Null where no platform reports usage. }
        minutesLeft: { type: [integer, "null"] }

    RequestStatus:
      type: string
      enum: [new, seen, needs_info, approved, declined, done, expired, cancelled]
    RequestKind:
      type: string
      enum: [app, bonus-time, buy, fix, idea, media, permission, picture, ride, surprise]
    RequestInput:
      type: object
      required: [kind, title]
      properties:
        kind: { $ref: "#/components/schemas/RequestKind" }
        title: { type: string, maxLength: 200 }
        details: { type: string, maxLength: 2000 }
        neededBy: { type: string, format: date-time }
        hiddenFrom: { type: array, items: { type: string }, description: For surprises. Hidden members never see the request. }
        onBehalfOf: { type: string, description: Services only; the verified sender. }
    Decision:
      type: object
      required: [decider, verdict, at, via]
      properties:
        decider: { type: string }
        verdict: { type: string, enum: [approve, decline, needs_info] }
        at: { type: string, format: date-time }
        via: { type: string, enum: [session, channel] }
        note: { type: string, maxLength: 500 }
        evidence: { $ref: "#/components/schemas/ChannelEvidence" }
    Request:
      type: object
      required: [id, kind, title, requester, deciders, policy, status, createdAt, revision, decisions]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/RequestKind" }
        title: { type: string }
        details: { type: string }
        requester: { type: string }
        deciders: { type: array, items: { type: string }, minItems: 1, description: Frozen at creation from the routing rules. }
        policy: { type: string, enum: [either, both] }
        status: { $ref: "#/components/schemas/RequestStatus" }
        neededBy: { type: [string, "null"], format: date-time }
        hiddenFrom: { type: array, items: { type: string } }
        decisions: { type: array, items: { $ref: "#/components/schemas/Decision" } }
        createdAt: { type: string, format: date-time }
        revision: { type: integer }
    DecisionInput:
      type: object
      required: [verdict, revision]
      properties:
        verdict: { type: string, enum: [approve, decline, needs_info] }
        note: { type: string, maxLength: 500 }
        revision: { type: integer, minimum: 1 }
    ChannelEvidence:
      type: object
      required: [channel, senderId, messageId]
      properties:
        channel: { type: string, examples: [chat-bot, sms] }
        senderId: { type: string, description: "Sender id from the platform's signed callback, checked against the decider's enrolled channel identity. Trusted only because the API verified the platform signature itself." }
        messageId: { type: string }
    ChannelDecision:
      type: object
      required: [decider, verdict, nonce, channelEvidence]
      properties:
        decider: { type: string }
        verdict: { type: string, enum: [approve, decline, needs_info] }
        nonce: { type: string, description: "One-time value minted by the API for this request, this decider and this verdict." }
        channelEvidence: { $ref: "#/components/schemas/ChannelEvidence" }
    RoutingRules:
      type: object
      required: [rules, default]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [deciders, policy]
            properties:
              fromRole: { $ref: "#/components/schemas/Role" }
              fromMember: { type: string }
              kind: { $ref: "#/components/schemas/RequestKind" }
              deciders: { type: array, items: { type: string }, minItems: 1 }
              policy: { type: string, enum: [either, both] }
        default:
          type: object
          required: [deciders, policy]
          properties:
            deciders: { type: array, items: { type: string }, minItems: 1 }
            policy: { type: string, enum: [either, both] }
        revision: { type: integer, minimum: 1 }

    CatalogApp:
      type: object
      required: [id, title, does, ageBands, choice, exitTest]
      properties:
        id: { type: string }
        title: { type: string }
        does: { type: string }
        ageBands: { type: array, items: { type: string, enum: [adult, "13-17", "8-12", under-8] } }
        choice: { type: string, enum: [adopt, build] }
        license: { type: string, description: For adopted software; verify at adoption. }
        exitTest: { type: string, description: How the household leaves without losing data. }
        needsParent: { type: boolean, default: false }
        tags: { type: array, items: { type: string } }
    AppOptIn:
      type: object
      required: [member, appId, optedInBy, at]
      properties:
        member: { type: string }
        appId: { type: string }
        optedInBy: { type: string }
        at: { type: string, format: date-time }
    AppSuggestionInput:
      type: object
      required: [title, why]
      properties:
        title: { type: string, maxLength: 120 }
        url: { type: string, format: uri }
        why: { type: string, maxLength: 500 }
        forMember: { type: string }
    AppSuggestion:
      allOf:
        - $ref: "#/components/schemas/AppSuggestionInput"
        - type: object
          required: [id, suggestedBy, requestId, status]
          properties:
            id: { type: string }
            suggestedBy: { type: string }
            requestId: { type: string }
            status: { type: string, enum: [open, added, declined] }

    DeviceInput:
      type: object
      required: [owner, kind, platform]
      properties:
        owner: { type: string }
        kind: { type: string, enum: [phone, tablet, laptop, console, tv, display, other] }
        platform: { type: string }
        label: { type: string, maxLength: 60 }
    Device:
      allOf:
        - $ref: "#/components/schemas/DeviceInput"
        - type: object
          required: [id, state]
          properties:
            id: { type: string }
            state: { type: string, enum: [active, lost, retired] }
            kioskBoundMember: { type: [string, "null"] }
    DeviceSchedule:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            type: object
            required: [days, from, to]
            properties:
              days: { type: array, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
              from: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
              to: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
              services: { type: array, items: { type: string }, description: Services to block in the window; empty means all internet. }

    AuditEntry:
      type: object
      required: [at, actor, actorKind, operationId, outcome]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string }
        actorKind: { type: string, enum: [person, device, service] }
        operationId: { type: string }
        targetId: { type: [string, "null"] }
        outcome: { type: string, enum: [ok, refused, error] }
        via: { type: string, enum: [session, channel, device, service] }
