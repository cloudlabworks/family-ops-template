services:
  api:
    image: family-ops-api:0.2.0
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - familyops-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  familyops-data:
